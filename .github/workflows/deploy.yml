name: Rebuild and deploy site and app

on:
  workflow_dispatch:

permissions:
  contents: read

# Finish an active deployment before starting the next one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-app:
    if: github.ref == 'refs/heads/main'
    # Build with the macOS 26 SDK. SwiftUI keeps older behavior, like popovers
    # that don't resize to fit, in apps built with older SDKs.
    environment: production
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      # Manually approved releases: this commit gets its own version.
      - name: Set the release version
        run: node scripts/set-release-version.mjs

      - name: Verify native tests
        run: swift test --package-path DevDock -j 4

      # Public downloads must always have complete signing credentials. Missing credentials stop the release.
      - name: Choose signing mode
        id: mode
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          missing=()
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD NOTARY_API_KEY NOTARY_API_KEY_ID \
                      NOTARY_API_ISSUER_ID SPARKLE_PRIVATE_KEY SPARKLE_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release signing is incomplete. Missing: ${missing[*]}. See DevDock/UPDATES.md."
            exit 1
          fi

      - name: Install signing credentials
        if: steps.mode.outputs.mode == 'release'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::DEVELOPER_ID_P12 does not contain a Developer ID Application certificate and private key."
            exit 1
          fi
          echo "CODE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

          (umask 077
           printf '%s\n' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary-key.p8"
           printf '%s\n' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-key")

      - name: Build, notarize and sign the update
        if: steps.mode.outputs.mode == 'release'
        env:
          SPARKLE_FEED_URL: ${{ vars.SPARKLE_FEED_URL }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/sparkle-key
          NOTARY_API_KEY_PATH: ${{ runner.temp }}/notary-key.p8
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw DevDock/Info.plist)"
          build="$(plutil -extract CFBundleVersion raw DevDock/Info.plist)"
          ./DevDock/release.sh "$version" "$build"
          mkdir -p dist
          cp DevDock/.build/DevDock.dmg dist/DevDock.dmg
          ditto DevDock/.build/updates dist/updates

      - name: Remove signing credentials
        if: always() && steps.mode.outputs.mode == 'release'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/sparkle-key"

      - name: Verify the download
        run: |
          hdiutil verify dist/DevDock.dmg
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist/DevDock.dmg
          codesign --verify --strict "$mount/DevDock.app"
          test "$(readlink "$mount/Applications")" = /Applications
          hdiutil detach "$mount"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-app
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build-app
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check deployment configuration
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name repository secret before deploying. See README.md."
              exit 1
            fi
          done

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      # The same version as the app, for the checks below and the site's structured data.
      - name: Set the release version
        run: node scripts/set-release-version.mjs

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mac-app
          path: public

      # Signed builds also bring public/updates/ with the Sparkle feed and archive.
      - name: Verify the rebuilt download
        run: |
          if [ -d public/updates ]; then
            test -f public/updates/appcast.xml
            ls public/updates
          fi
          VERCEL_ENV=production node scripts/check-download.mjs

      - name: Install dependencies and Vercel CLI
        run: |
          npm ci --ignore-scripts
          npm test
          npm audit --audit-level=low
          npm install --global vercel@59.6.2

      - name: Pull production configuration
        run: vercel pull --yes --environment=production

      - name: Build the site with the rebuilt app
        run: vercel build --prod

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --yes
