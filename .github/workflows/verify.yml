name: Verify security and behavior
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: swift test --package-path DevDock -j 4
      - run: python3 DevDock/scripts/test-configure-updates.py
      - run: brew install shellcheck gitleaks
      - run: shellcheck DevDock/*.sh scripts/verify.sh
      - run: gitleaks git --redact
      - run: ./DevDock/build-app.sh
